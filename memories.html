<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="style.css">
    <style>
        .memories-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
            text-align: center;
        }
        .memories-title {
            color: var(--primary-pink, #ff6b8b);
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        .memories-subtitle {
            color: var(--accent-grey, #666);
            font-size: 1.1rem;
            margin-bottom: 40px;
        }
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 25px;
            justify-content: center;
            align-items: center;
        }
        .memory-card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(255, 107, 139, 0.15);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            aspect-ratio: 9 / 16; /* Full 9:16 vertical format */
            position: relative;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            transform: none !important;
        }
        .memory-card:hover {
            transform: translateY(-5px) !important;
            box-shadow: 0 12px 30px rgba(255, 107, 139, 0.25);
        }
        .memory-card img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Fills the entire 9:16 card completely */
            display: block;
        }
        .memory-overlay-caption {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 25px 15px 15px 15px;
            background: linear-gradient(to top, #ff6b8b, transparent);
            color: #ffffff;
            font-weight: bold;
            font-size: 1rem;
            text-align: center;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
        }

        /* Book Letter Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            backdrop-filter: blur(4px);
        }
        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        .book-letter {
            background: #fffdf9;
            background-image: linear-gradient(to right, rgba(255, 240, 243, 0.4), #fffdf9);
            border: 2px solid #ffb6c1;
            border-radius: 16px;
            width: 85%;
            max-width: 550px;
            padding: 35px;
            box-shadow: 0 15px 35px rgba(255, 107, 139, 0.3);
            position: relative;
            transform: scale(0.8);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-align: left;
            max-height: 80vh;
            overflow-y: auto;
        }
        .modal-overlay.active .book-letter {
            transform: scale(1);
        }
        .book-letter h3 {
            color: #ff6b8b;
            margin-bottom: 15px;
            font-size: 1.6rem;
            border-bottom: 2px dashed #ffb6c1;
            padding-bottom: 10px;
        }
        .book-content {
            font-size: 1.05rem;
            color: #444;
            line-height: 1.7;
            white-space: pre-line;
            font-family: 'Georgia', serif;
        }
        .close-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            background: #ff6b8b;
            color: white;
            border: none;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 3px 8px rgba(255, 117, 140, 0.3);
            transition: background 0.2s;
        }
        .close-btn:hover {
            background: #ff5270;
        }

        @media (max-width: 768px) {
            .gallery-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 15px;
            }
        }
        @media (max-width: 480px) {
            .gallery-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>

        const gridElement = document.getElementById('gallery-grid');
        memoriesData.forEach((item, index) => {
            const card = document.createElement('div');
            card.className = 'memory-card';
            card.innerHTML = `
                <img src="${item.img}" alt="${item.title}">
                <div class="memory-overlay-caption">${item.title}</div>
            `;
            card.addEventListener('click', () => openLetter(index));
            gridElement.appendChild(card);
        });

        const modal = document.getElementById('letter-modal');
        const modalTitle = document.getElementById('modal-title');
        const modalText = document.getElementById('modal-text');

        function openLetter(index) {
            const memory = memoriesData[index];
            modalTitle.textContent = memory.title;
            modalText.textContent = memory.text;
            modal.classList.add('active');
        }

        function closeLetter() {
            modal.classList.remove('active');
        }

        function closeLetterOnOutside(event) {
            if (event.target === modal) {
                closeLetter();
            }
        }

        // Paw background animation script
        document.addEventListener('DOMContentLoaded', () => {
            const canvas = document.getElementById('bg-canvas');
            if (!canvas) return;
            
            const ctx = canvas.getContext('2d');
            
            function resizeCanvas() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();

            class PawParticle {
                constructor() {
                    this.reset();
                }
                
                reset() {
                    this.x = Math.random() * canvas.width;
                    this.y = canvas.height + 50;
                    this.size = Math.random() * 14 + 18;
                    this.speedY = Math.random() * 0.7 + 0.3;
                    this.speedX = (Math.random() - 0.5) * 0.4;
                    this.alpha = Math.random() * 0.45 + 0.3;
                    this.rotation = (Math.random() - 0.5) * 0.5;
                    this.rotSpeed = (Math.random() - 0.5) * 0.008;
                }

                update() {
                    this.y -= this.speedY;
                    this.x += this.speedX + Math.sin(this.y * 0.015) * 0.3;
                    this.rotation += this.rotSpeed;
                    
                    if (this.y < -50) {
                        this.reset();
                        this.y = canvas.height + 50;
                    }
                }

                draw() {
                    ctx.save();
                    ctx.translate(this.x, this.y);
                    ctx.rotate(this.rotation);
                    ctx.globalAlpha = this.alpha;
                    
                    ctx.fillStyle = '#ff6b8b'; 
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
                    ctx.lineWidth = 1.5;

                    ctx.beginPath();
                    ctx.ellipse(0, this.size * 0.25, this.size * 0.32, this.size * 0.25, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.stroke();

                    const toeRadius = this.size * 0.12;
                    const toePositions = [
                        { x: -this.size * 0.33, y: -this.size * 0.10 },
                        { x: -this.size * 0.11, y: -this.size * 0.26 },
                        { x: this.size * 0.11, y: -this.size * 0.26 },
                        { x: this.size * 0.33, y: -this.size * 0.10 }
                    ];

                    toePositions.forEach(pos => {
                        ctx.beginPath();
                        ctx.arc(pos.x, pos.y, toeRadius, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.stroke();
                    });

                    ctx.restore();
                }
            }

            const paws = Array.from({ length: 20 }, () => new PawParticle());

            function animatePaws() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                paws.forEach(paw => {
                    paw.update();
                    paw.draw();
                });
                requestAnimationFrame(animatePaws);
            }
            
            animatePaws();
        });
    </script>
